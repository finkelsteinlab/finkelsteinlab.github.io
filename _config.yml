# This is the default format.
# For more see: http://jekyllrb.com/docs/permalinks/
# permalink: /:categories/:year/:month/:day/:title
permalink: /:categories/:title

# Note on the entries after "_plugins/":
#
# `papers/loop.html` is an include_relative partial with no front matter, so
# Jekyll was copying it verbatim and serving raw Liquid at /papers/loop.html.
#
# The seven page bodies below are also include_relative partials. Because
# jekyll-optional-front-matter publishes front-matter-less markdown as pages,
# each was ALSO being served standalone and unstyled at /contact/contact,
# /cv/cv and so on - duplicating its real page and padding the sitemap.
#
# `exclude` stops the file being written to _site; include_relative still reads
# it from source, so the real pages are unaffected. Verified by build.
exclude: ["vendor/", ".rvmrc", ".rbenv-version", "README.md", "blog/README.md", "Rakefile", "changelog.md", ".sublime-project", ".sublime-workspace", "desktop.ini", "AGENTS.md", "*.backup", "scripts/", "_plugins/", "assets/md/FORMATTING-RULES.md", "assets/md/PUBLISHING-A-PREPRINT.md", "papers/loop.html", "contact/contact.md", "cv/cv.md", "cv/cv-full.md", "join/join.md", "research/research.md", "teaching/teaching.md", "wiki/wiki.md"]
highlighter: rouge

markdown: kramdown

repository: finkelsteinlab/finkelsteinlab.github.io

# Themes are encouraged to use these universal variables
# so be sure to set them if your theme uses them.
#
title : Finkelstein Lab
tagline: Biophysical Studies of Molecular Machines
institution:
  url: https://www.utexas.edu
  name: The University of Texas at Austin
department:
  url: https://molecularbiosci.utexas.edu
  name: Department of Molecular Biosciences
author :
  name: Ilya Finkelstein
  email: ilya@finkelsteinlab.org
  github: finkelsteinlab
  twitter: ilyafinkelstein
wiki:
  url: http://50.116.21.252/wiki

# The production_url is only used when full-domain names are needed
# such as sitemap.txt
# Most places will/should use BASE_PATH to make the urls
#
# If you have set a CNAME (pages.github.com) set your custom domain here.
# Else if you are pushing to username.github.io, replace with your username.
# Finally if you are pushing to a GitHub project page, include the project name at the end.
#
production_url : https://finkelsteinlab.org

# Used by jekyll-redirect-from to build absolute redirect targets. Without it
# the plugin falls back to GitHub repository metadata, which is only available
# when the build has API access - so local builds emit github.com/pages/... URLs.
# Setting it explicitly makes redirects identical locally and in production.
url: https://finkelsteinlab.org
baseurl: ""

# All Jekyll-Bootstrap specific configurations are namespaced into this hash
#
JB :
  version : 0.3.0

  # All links will be namespaced by BASE_PATH if defined.
  # Links in your website should always be prefixed with {{BASE_PATH}}
  # however this value will be dynamically changed depending on your deployment situation.
  #
  # CNAME (http://yourcustomdomain.com)
  #   DO NOT SET BASE_PATH
  #   (urls will be prefixed with "/" and work relatively)
  #
  # GitHub Pages (http://username.github.io)
  #   DO NOT SET BASE_PATH
  #   (urls will be prefixed with "/" and work relatively)
  #
  # GitHub Project Pages (http://username.github.io/project-name)
  #
  #   A GitHub Project site exists in the `gh-pages` branch of one of your repositories.
  #  REQUIRED! Set BASE_PATH to: http://username.github.io/project-name
  #
  # CAUTION:
  #   - When in Localhost, your site will run from root "/" regardless of BASE_PATH
  #   - Only the following values are falsy: ["", null, false]
  #   - When setting BASE_PATH it must be a valid url.
  #     This means always setting the protocol (http|https) or prefixing with "/"
  BASE_PATH : false

  # By default, the asset_path is automatically defined relative to BASE_PATH plus the enabled theme.
  # ex: [BASE_PATH]/assets/themes/[THEME-NAME]
  #
  # Override this by defining an absolute path to assets here.
  # ex:
  #   http://s3.amazonaws.com/yoursite/themes/watermelon
  #   /assets
  #
  ASSET_PATH : false

  # These paths are to the main pages Jekyll-Bootstrap ships with.
  # Some JB helpers refer to these paths; change them here if needed.
  #
  archive_path: /archive.html
  categories_path : /categories.html
  tags_path : /tags.html
  atom_path : /atom.xml
  rss_path : /rss.xml

  # Settings for comments helper
  # Set 'provider' to the comment provider you want to use.
  # Set 'provider' to false to turn commenting off globally.
  #
  comments :
    provider : false
    disqus :
      short_name : jekyllbootstrap
    livefyre :
      site_id : 123
    intensedebate :
      account : 123abc
    facebook :
      appid : 123
      num_posts: 5
      width: 580
      colorscheme: light

  # Settings for analytics helper
  # Set 'provider' to the analytics provider you want to use.
  # Set 'provider' to false to turn analytics off globally.
  #
  analytics :
    provider : false
    google :
      tracking_id :
    getclicky :
      site_id :
    mixpanel :
      token : '_MIXPANEL_TOKEN_'
    piwik :
      baseURL : 'myserver.tld/piwik' # Piwik installation address (without protocol)
      idsite : '1'                   # the id of the site on Piwik

  # Settings for sharing
  # Sharing is for things like tweet, plusone, hn upvotes, like, linkedin
  # Add a tweet button    => provider : tweet
  # Add a like button     => provider : like (you also need a facebook appid)
  # Add a plus one button   => provider : plusone
  # Add a HN button     => provider : hn
  # Add them all (i.e. hn + tweet + plusone + like) => provider : all
  # Set 'provider' to the sharing provider you want to use.
  # Set 'provider' to false to turn sharing off globally.
  #
  sharing :
   provider : tweet
   twitter :
     size :
     via :
     count :
   facebook :
     appid : 123
     layout : button_count
     font :
     faces : false
     width : 90
   googleplus :
     size : medium
     width :
     annotation : bubble
   linkedin :
     counter : right

  # Settings for all other include helpers can be defined by creating
  # a hash with key named for the given helper. ex:
  #
  #   pages_list :
  #     provider : "custom"
  #
  # Setting any helper's provider to 'custom' will bypass the helper code
  # and include your custom code. Your custom file must be defined at:
  #   ./_includes/custom/[HELPER]
  # where [HELPER] is the name of the helper you are overriding.

# allow page redirection
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Blog post defaults
defaults:
  - scope:
      path: "blog/_posts"
      type: "posts"
    values:
      layout: "blog-post"
      category: "blog"
      author: "Ilya Finkelstein"
      permalink: /blog/:slug/
  # Drafts render through the same layout so `jekyll serve --drafts` previews
  # match what publishing will actually produce. The permalink has to be
  # repeated here: without it drafts fall back to the site-wide
  # /:categories/:title and preview at /blog/<slug> rather than the
  # /blog/<slug>/ a published post gets, which is exactly the mismatch this
  # block exists to avoid.
  - scope:
      path: "blog/_drafts"
      type: "posts"
    values:
      layout: "blog-post"
      category: "blog"
      author: "Ilya Finkelstein"
      permalink: /blog/:slug/
