<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{{ page.title }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <meta name="author" content="{{ site.author.name }}">

    <!-- Enable responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Bootstrap styles -->
    <link href="{{ ASSET_PATH }}/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Optional theme -->
    <link href="{{ ASSET_PATH }}/bootstrap/css/bootstrap-theme.min.css" rel="stylesheet"/>
    <!-- Sticky Footer -->
    <link href="{{ ASSET_PATH }}/bootstrap/css/bs-sticky-footer.css" rel="stylesheet"/>

    <!-- Custom styles -->
    <link href="{{ ASSET_PATH }}/css/style.css?body=1" rel="stylesheet" type="text/css" media="all"/>
    <link href="/assets/themes/lab/css/people.css" rel="stylesheet" type="text/css">

    <!-- icon -->
    <link rel="shortcut icon" href="/assets/images/favicon.ico"/>

    <!-- Custom fonts and icons via Font Awesome, http://fortawesome.github.io/Font-Awesome/ -->
    <link href="/assets/themes/lab/css/fontawesome-free-5.2.0-web/css/all.css" rel="stylesheet">

    <!-- Fonts for academic resources -->
    <link rel="stylesheet" href="/assets/themes/lab/css/academicons-1.8.6/css/academicons.min.css"/>

    <!-- Fonts via Google -->
    <link href='http://fonts.googleapis.com/css?family=Lato:300italic,700italic,300,700' rel='stylesheet' type='text/css'/>

    <!-- Theme (Catppuccin light/dark) -->
    <link href="/assets/themes/lab/css/theme.css" rel="stylesheet" type="text/css"/>
    <script src="/assets/themes/lab/js/theme-toggle.js"></script>

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Ilya Finkelstein",
      "givenName": "Ilya",
      "familyName": "Finkelstein",
      "honorificSuffix": "PhD",
      "jobTitle": "Professor of Molecular Biosciences",
      "worksFor": {
        "@type": "Organization",
        "name": "The University of Texas at Austin",
        "url": "https://www.utexas.edu"
      },
      "url": "https://finkelsteinlab.org",
      "email": "ilya@finkelsteinlab.org",
      "image": "https://finkelsteinlab.org/assets/images/members/ilya_old.jpg",
      "sameAs": [
        "https://scholar.google.com/citations?user=0j1TcuMAAAAJ",
        "https://www.linkedin.com/in/ilya-finkelstein/",
        "https://github.com/finkelsteinlab",
        "https://orcid.org/0000-0002-9371-2431"
      ],
      "hasOccupation": [
        {
          "@type": "Occupation",
          "name": "Professor",
          "occupationalCategory": "Academic Research"
        },
        {
          "@type": "Occupation",
          "name": "Expert Witness",
          "occupationalCategory": "Legal Consulting",
          "description": "Expert witness testimony in biotechnology, cell and gene therapy, and molecular biology patent litigation"
        }
      ],
      "knowsAbout": [
        "Molecular Biology", "Biotechnology", "Gene Editing", "Gene Therapy",
        "Cell Therapy", "Cell and Gene Therapy", "CRISPR", "Genome Editing",
        "Next-Generation Sequencing", "Single-Molecule Biophysics", "DNA Repair",
        "Protein Engineering", "Synthetic Biology", "Intellectual Property Consulting",
        "Patent Litigation", "Expert Witness Testimony"
      ],
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "Stanford University" },
        { "@type": "CollegeOrUniversity", "name": "University of California, Berkeley" }
      ],
      "award": [
        "Edith and Peter O'Donnell Award in Biological Sciences (TAMEST, 2025)",
        "Norman Hackerman Award in Chemical Sciences (Welch Foundation, 2021)",
        "NSF CAREER Award (2015)"
      ]
    }
    </script>

    <!-- Math via MathJax -->
    <script type="text/javascript" src="/assets/js/MathJax.js"></script>
    <script src="/assets/js/jquery.js" type="text/javascript"></script>

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
      <script src="https://oss.maxcdn.com/libs/respond.js/1.3.0/respond.min.js"></script>
    <![endif]-->

    <!-- Fav and touch icons -->
    <!-- Update these with your own images
      <link rel="shortcut icon" href="images/favicon.ico">
      <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
      <link rel="apple-touch-icon" sizes="72x72" href="images/apple-touch-icon-72x72.png">
      <link rel="apple-touch-icon" sizes="114x114" href="images/apple-touch-icon-114x114.png">
    -->

    <!-- atom & rss feed
    <link href="{{ BASE_PATH }}{{ site.JB.atom_path }}" type="application/atom+xml" rel="alternate" title="Sitewide ATOM Feed">
    <link href="{{ BASE_PATH }}{{ site.JB.rss_path }}" type="application/rss+xml" rel="alternate" title="Sitewide RSS Feed">
    -->

  </head>

  <body>

  <!-- Static top navbar -->

  <nav class="navbar navbar-default navbar-fixed-top" role="navigation">
  <div class='container'>

<a href="/">
        <img class="pull-left logo" src="/assets/images/jenna-luecke-logo.gif" type="image/gif">
</a>
      <a class='navbar-brand navbar-left' style='font-size: large; font-weight: bold' href='/'>Finkelstein Lab</a>

      <!-- Brand and toggle get grouped for better mobile display -->
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#jb-navbar-collapse">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
      </div>


      <!-- Collect the nav links, forms, and other content for toggling -->
      <div class="collapse navbar-collapse" id="jb-navbar-collapse">
        <ul class="nav navbar-nav navbar-right hidden-sm">
          <a class="navbar-brand" href="/research/">research</a>
          <a class="navbar-brand" href="/members/">team</a>
          <a class="navbar-brand" href="/papers/">papers</a>
          <a class="navbar-brand" href="/news/">news</a>
          <a class="navbar-brand" href="/join/">join us</a>
        </ul>
      </div><!-- /.navbar-collapse -->
    </nav>
   </div>

   <!-- Content -->
   <div class="container">
      {{ content }}
   </div>


  <!-- Static bottom navbar -->
  <nav class="navbar navbar-default navbar-fixed-bottom">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#jb-bottom-collapse"> <!-- NOTE! data-target was changed to jb-bottom-collapse -->
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
      </div>
      <!-- Collect the nav links, forms, and other content for toggling -->
      <div class="collapse navbar-collapse" id="jb-bottom-collapse">
        <ul class="nav navbar-nav navbar-left navbar-small">
          <li><a href={{ site.wiki.url }}> &gt;Wiki</a></li>
          <li><a href="/contact/"> &gt;Contact</a></li>
          <li><a href={{ site.department.url }}> &gt;{{ site.department.name }}</a></li>
          <li><a href={{ site.institution.url }}>	&gt;{{ site.institution.name }}</a></li>
        </ul>
        <ul class="nav navbar-nav navbar-right navbar-small">
          <li>
            <button type="button" class="theme-toggle" aria-label="Toggle theme">
              <span class="theme-toggle-icon">🌙</span>
              <span class="theme-toggle-text">Dark</span>
            </button>
          </li>
        </ul>
      </div><!-- /.navbar-collapse -->
    </div>
  </nav>



    {% include JB/analytics %}

    <script src="/assets/js/jquery.min.js"></script>

</html>
